<!DOCTYPE html> <!-- Dichiara il tipo di documento come HTML5 -->
<html lang="it"> <!-- Apertura del tag HTML con impostazione della lingua italiana -->
<head> <!-- Contenitore dei metadati della pagina -->
    <meta charset="UTF-8"> <!-- Imposta la codifica dei caratteri in UTF-8 -->
    <title>Apple Catcher</title> <!-- Titolo della scheda nel browser -->
    <link rel="stylesheet" href="Apple.css"> <!-- Collega il foglio di stile CSS esterno -->
</head> <!-- Chiusura del blocco head -->
<body> <!-- Contenitore per tutti gli elementi visibili nella pagina -->
    <h1>Apple Catcher</h1> <!-- Titolo principale visibile sopra il gioco -->
   
    <div id="game-wrapper"> <!-- Contenitore principale dell'area di gioco -->
        <!-- Schermata di Avvio -->
        <div id="start-screen" class="overlay"> <!-- Overlay per il menu iniziale -->
            <h2>Apple Catcher</h2> <!-- Titolo interno alla schermata d'avvio -->
            <p>Usa le frecce Destra e Sinistra per raccogliere le mele!</p> <!-- Istruzioni del gioco -->
            <button onclick="startGame()">GIOCA</button> <!-- Bottone che avvia il gioco chiamando startGame() -->
        </div> <!-- Chiusura overlay d'avvio -->

        <!-- Schermata di Game Over -->
        <div id="game-over-screen" class="overlay hidden"> <!-- Overlay per il Game Over (inizialmente nascosto) -->
            <h2 style="color: #ff0055;">GAME OVER</h2> <!-- Titolo di Game Over colorato di rosso -->
            <p>Punteggio Finale: <span id="final-score">0</span></p> <!-- Contenitore per mostrare il punteggio finale -->
            <button onclick="restartGame()">RIPARTI</button> <!-- Bottone per riavviare la partita -->
        </div> <!-- Chiusura overlay Game Over -->
    </div> <!-- Chiusura del game-wrapper -->

    <!-- Script inclusi nell'ordine di dipendenza -->
    <script src="Immagini.js"></script> <!-- Carica le immagini del gioco -->
    <script src="Gamearea.js"></script> <!-- Carica il motore del Canvas -->
    <script src="Mele.js"></script> <!-- Carica il costruttore e la gestione delle mele -->
    <script src="Cesto.js"></script> <!-- Carica il cesto e il ciclo principale di gioco -->
</body> <!-- Chiusura del corpo del documento -->
</html> <!-- Chiusura della pagina HTML -->
